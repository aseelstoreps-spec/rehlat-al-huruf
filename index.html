<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الحروف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#23266b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icons/rehla-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/rehla.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/rehla-touch.png">
<script src="config.js"></script>
<script src="cert.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&family=Noto+Naskh+Arabic:wght@700&display=swap">
<style>
/* Layout: one-screen app, a single centered column (max 560px) — map → lesson → stage/game/test */
:root {
  --bg: #f7f7fc;
  --bg-2: #eceefa;
  --ink: #1b1d45;
  --ink-soft: #565a86;
  --card: #ffffff;
  --green: #23266b;
  --green-dark: #15174a;
  --gold: #ffd23f;
  --gold-soft: #fff6d1;
  --red: #c8233a;
  --blue: #2a5fd0;
  --ok: #17804f;
  --bad: #d9485f;
  --locked: #cfd1e6;
  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-letter: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --r: 22px;
  --f-title: "Lalezar", "IBM Plex Sans Arabic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(circle at 20% 0%, #ffffff 0, var(--bg) 45%, var(--bg-2) 100%) fixed;
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 18px;
  overflow-x: hidden;
}
#app {
  max-width: 560px;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.homegrid, .homegrid .side, .mapcol, .logingrid, .lside, .lmain { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.formhead { margin: 0 0 4px; font-family: var(--f-title); font-weight: 400; font-size: 1.4rem; }
/* الحاسوب واللوحي: الشاشة كلها بدل عمود الهاتف */
@media (min-width: 700px) {
  #app { max-width: 780px; }
}
@media (min-width: 1000px) {
  #app { max-width: 1200px; padding-block: 20px 40px; gap: 20px; }
  .bar { min-height: 66px; }
  .bar h1 { font-size: 1.9rem; }
  .bar h1 .wordmark { height: 44px; }
  .homegrid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 32px; align-items: start; }
  .homegrid .side { position: sticky; top: 16px; }
  .mapcol { background: var(--card); border-radius: 28px; padding: 12px 28px 28px; box-shadow: 0 6px 0 #d5d7ee; }
  .logingrid { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 32px; align-items: start; }
  .lmain { position: sticky; top: 16px; }
  .kids { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  #app > .trail, #app > .explain, #app > .learn, #app > .ask, #app > .progress, #app > .result,
  #app > .certwrap, #app > .certactions, #app > .sky, #app > .steps, #app > .tbanner + .trail { width: 100%; max-width: 880px; margin-inline: auto; }
  #app > .progress, #app > .ask { max-width: 760px; }
  #app > .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 900px; margin-inline: auto; }
  #app > .opts .opt { width: 170px; }
  #app > .opts .opt.word { width: 240px; }
  #app > .opts .opt.cls { width: 210px; }
  .sylgrid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .syl { font-size: 2.8rem; }
  .card-letter { max-width: 420px; }
}
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; min-height: 56px; }
.bar h1 { flex: 1; margin: 0; font-family: var(--f-title); font-size: 1.5rem; font-weight: 400; text-wrap: balance; line-height: 1.2; }
.bar h1 .wordmark { height: 36px; max-width: 100%; width: auto; display: block; }
.icon-btn {
  width: 52px; height: 52px; flex: none; border-radius: 16px; background: var(--card);
  box-shadow: 0 3px 0 #d5d7ee; font-size: 1.5rem; display: grid; place-items: center;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d5d7ee; }
.pill {
  display: inline-flex; flex: none; white-space: nowrap; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
  background: var(--gold-soft); color: #1b1d45; font-weight: 800; font-variant-numeric: tabular-nums;
}
.hint {
  direction: ltr; text-align: left; font-family: system-ui, sans-serif; font-size: .85rem;
  color: var(--ink-soft); background: #ffffffaa; border-radius: 12px; padding: 6px 12px;
}

/* map */
.hero {
  background: var(--green); color: #fff; border-radius: var(--r); padding: 18px 20px;
  display: flex; gap: 14px; align-items: center; position: relative; overflow: hidden;
}
.hero .big { white-space: nowrap; font-family: var(--f-letter); font-size: 2.8rem; line-height: 1; color: var(--gold); }
.hero p { margin: 0; line-height: 1.5; }
.hero .mark { width: 64px; height: 64px; flex: none; border-radius: 16px; box-shadow: 0 0 0 2px #ffffff33; }
.hero b { font-family: var(--f-title); font-weight: 400; font-size: 1.5rem; }
.map { display: flex; flex-direction: column; gap: 4px; padding-block: 6px; }
.station { display: flex; align-items: center; gap: 14px; }
.station:nth-child(even) { flex-direction: row-reverse; text-align: left; }
.station:nth-child(even) .st-label { text-align: left; }
.node {
  width: 78px; height: 78px; flex: none; border-radius: 50%; font-size: 1.6rem; font-weight: 800;
  display: grid; place-items: center; background: var(--locked); color: #fff; box-shadow: 0 6px 0 #b4b7d6;
  position: relative;
}
.node.open { background: var(--gold); color: #1b1d45; box-shadow: 0 6px 0 #d9a800; animation: bob 2.2s ease-in-out infinite; }
.node.done { background: var(--green); box-shadow: 0 6px 0 var(--green-dark); }
.node .lock { font-size: 1.3rem; }
.st-label { flex: 1; min-width: 0; }
.st-label small { display: block; color: var(--ink-soft); font-size: .8rem; }
.st-label span { font-weight: 700; line-height: 1.3; }
.st-stars { font-size: .9rem; letter-spacing: 2px; }
.connector { width: 6px; height: 18px; border-radius: 3px; background: #d5d7ee; margin-inline: 36px; }
.station:nth-child(4n+3) + .connector { margin-inline-start: auto; }

/* الطريق المتعرّج: خريطة الدروس ومراحل الدرس */
.trail { position: relative; container-type: inline-size; direction: ltr; margin-block: 30px 10px; }
/* جزر في السماء */
.trail.sky { margin-block: 0; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 #d5d7ee; }
.mapcol .trail.sky { margin-inline: -4px; }
.trail.sky .hopline { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 0 15; opacity: .95; }
.trail.sky .hopline.done { stroke: #e06a00; }
.trail.sky .isl.locked { opacity: .72; }
.trail.sky .cl.far { animation: drift 38s ease-in-out infinite alternate; }
.trail.sky .cl.near { opacity: .9; animation: drift 26s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translateX(34px); } }
.trail.sky .tlabel { width: max-content; max-width: min(calc(var(--x) * 100cqw - 80px), 230px); right: 60px; top: 14px; transform: none; background: #ffffffe8; border-radius: 14px; padding: 6px 12px; box-shadow: 0 2px 0 #d5d7ee; }
.trail.sky .tstop.r .tlabel { right: auto; left: 60px; max-width: min(calc((1 - var(--x)) * 100cqw - 80px), 230px); }
.trail.sky .tdeco { display: none; }
.trail.sky .node, .trail.sky .tnode { box-shadow: 0 6px 0 #15174a33, 0 10px 18px #23266b33; }
.traveler { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px #fff, 0 6px 14px #e06a0066; z-index: 6; pointer-events: none; }
#app.enter > *:not(.bar) { animation: enterZoom .42s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes enterZoom { from { opacity: 0; transform: scale(.94) translateY(14px); } }
.backbtn { text-decoration: none; text-align: center; align-self: center; }
.trail-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.trail-svg .road { fill: none; stroke: #e3e5f5; stroke-width: 30; stroke-linecap: round; }
.trail-svg .road.done { stroke: var(--gold-soft); }
.trail-svg .lane { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 0 15; }
.trail-svg .lane.done { stroke: #e06a00; }
.tstop { position: absolute; left: calc(var(--x) * 100%); width: 0; height: 84px; }
.tstop > .node, .tstop > .tnode { position: absolute; left: -39px; top: 3px; }
.tstop.big > .tnode { left: -47px; top: -5px; width: 94px; height: 94px; font-size: 2.6rem; }
.tlabel { position: absolute; top: 42px; transform: translateY(-50%); direction: rtl; background: none; padding: 4px 6px; border-radius: 14px;
  width: min(calc(var(--x) * 100cqw - 56px), 240px); right: 50px; text-align: right; line-height: 1.3; }
.tstop.r .tlabel { right: auto; left: 50px; width: min(calc((1 - var(--x)) * 100cqw - 56px), 240px); text-align: left; }
.tdeco { position: absolute; top: 14px; left: 48px; font-family: var(--f-letter); font-size: 2.4rem; line-height: 1; color: var(--green); opacity: .16; pointer-events: none; }
.tstop.r .tdeco { left: auto; right: 48px; }
.tlabel small { display: block; color: var(--ink-soft); font-size: .8rem; }
.tlabel b { display: block; font-size: 1.05rem; }
.tlabel .ltrs { display: block; font-family: var(--f-letter); font-size: 1.15rem; letter-spacing: 2px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tlabel[disabled] { opacity: .55; }
.tnode {
  width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; line-height: 1;
  background: var(--card); box-shadow: 0 6px 0 #d5d7ee; border: 4px solid var(--card);
}
.tnode .glyph { font-family: var(--f-letter); font-size: 2.2rem; line-height: 1.2; }
.tnode.done { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 6px 0 var(--green-dark); }
.tnode.open { background: var(--gold); border-color: var(--gold); color: #1b1d45; box-shadow: 0 6px 0 #d9a800; }
.tnode[disabled] { background: var(--locked); border-color: var(--locked); box-shadow: 0 6px 0 #b4b7d6; filter: grayscale(.4); }
.tnode:active:not([disabled]), .node:active { transform: translateY(4px); box-shadow: none; }
.tstop .badge-ok { position: absolute; top: -2px; left: 18px; width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: #fff;
  font-size: .85rem; display: grid; place-items: center; border: 3px solid var(--card); z-index: 1; pointer-events: none; }
.here { position: absolute; left: 0; top: -30px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: .8rem; font-weight: 800;
  padding: 2px 10px; border-radius: 999px; white-space: nowrap; z-index: 2; pointer-events: none; animation: bob 2.2s ease-in-out infinite; }
.here::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
.tstop.cur > .node, .tstop.cur > .tnode { animation: none; outline: 4px solid var(--gold); outline-offset: 5px; }

/* lesson steps */
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.step {
  background: var(--card); border-radius: var(--r); padding: 14px 12px 12px; min-height: 132px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 5px 0 #d5d7ee; text-align: center; position: relative;
}
.step:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 2px 0 #d5d7ee; }
.step .ico { font-size: 2rem; line-height: 1; }
.step .ltrs { font-family: var(--f-letter); font-size: 1.7rem; line-height: 1.3; letter-spacing: 4px; direction: rtl; }
.step .lbl { font-weight: 800; font-size: 1rem; }
.step.wide { grid-column: 1 / -1; min-height: 100px; flex-direction: row; gap: 14px; background: var(--gold-soft); }
.step[disabled] { opacity: .45; cursor: not-allowed; }
.step .tick {
  position: absolute; top: 8px; inset-inline-start: 8px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--ok); color: #fff; font-size: .95rem; display: grid; place-items: center;
}
.step.current { outline: 4px solid var(--gold); outline-offset: -4px; }

/* learn card */
.learn { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.card-letter {
  width: min(100%, 360px); aspect-ratio: 1 / 1; max-width: 100%; background: var(--card); border-radius: 32px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 8px 0 #d5d7ee; border: 4px solid var(--green);
}
.card-letter .glyph { font-family: var(--f-letter); font-size: clamp(9rem, 48vw, 13rem); line-height: 1.05; }
.card-letter .name { color: var(--red); font-size: 1.6rem; font-weight: 800; position: absolute; top: 12px; inset-inline-end: 22px; }
.card-letter.pulse { animation: pulse .5s ease; }
.speak {
  width: 86px; height: 86px; border-radius: 50%; background: var(--green); color: #fff; font-size: 2.3rem;
  box-shadow: 0 6px 0 #15174a; display: grid; place-items: center;
}
.speak:active { transform: translateY(3px); box-shadow: 0 3px 0 #15174a; }
.speak.small { width: 64px; height: 64px; font-size: 1.7rem; }
.navrow { display: flex; align-items: center; justify-content: center; gap: 22px; width: 100%; }
.arrow {
  width: 64px; height: 64px; border-radius: 50%; background: var(--card); font-size: 1.8rem; font-weight: 800;
  box-shadow: 0 4px 0 #d5d7ee; display: grid; place-items: center;
}
.arrow[disabled] { opacity: .3; }
.strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  width: 50px; height: 50px; border-radius: 14px; background: var(--card); font-family: var(--f-letter);
  font-size: 1.6rem; display: grid; place-items: center; box-shadow: 0 3px 0 #d5d7ee; border: 3px solid transparent;
}
.chip.seen { background: #e4f3ec; }
.chip.cur { border-color: var(--gold); }
.go {
  background: var(--green); color: #fff; font-size: 1.3rem; font-weight: 800; padding: 14px 28px;
  border-radius: 999px; box-shadow: 0 6px 0 var(--green-dark); display: inline-flex; gap: 10px; align-items: center;
}
.go:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--green-dark); }
.go.gold { background: var(--gold); color: #1b1d45; box-shadow: 0 6px 0 #d9a800; }

/* quiz */
.progress { height: 14px; border-radius: 999px; background: #ffffff; overflow: hidden; box-shadow: inset 0 2px 0 #dcddf0; }
.progress i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .35s ease; }
.ask { display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 120px; }
.ask .target {
  font-family: var(--f-letter); font-size: 6rem; line-height: 1; background: var(--card); border-radius: 26px;
  width: 140px; height: 140px; display: grid; place-items: center; border: 4px dashed var(--blue);
}
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt {
  background: var(--card); border-radius: 26px; aspect-ratio: 1 / 1; max-width: 100%;
  font-family: var(--f-letter); font-size: clamp(3.6rem, 17vw, 5.2rem); line-height: 1;
  display: grid; place-items: center; box-shadow: 0 6px 0 #d5d7ee; border: 4px solid transparent;
  transition: background .2s, border-color .2s;
}
.opt:active { transform: translateY(3px); box-shadow: 0 3px 0 #d5d7ee; }
.opt.right { background: #dff5e7; border-color: var(--ok); }
.opt.wrong { background: #fde5e3; border-color: var(--bad); animation: shake .4s; }
.opt.reveal { border-color: var(--ok); border-style: dashed; }
.opts.lock .opt { pointer-events: none; }

/* balloons */
.sky {
  position: relative; height: min(62vh, 520px); border-radius: var(--r); overflow: hidden;
  background: linear-gradient(#bfe3ff, #e9f6ff 70%, #f6fbff);
}
.sky::after { content: ""; position: absolute; inset: auto 0 0 0; height: 36px; background: #9ed39f; border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
.balloon {
  position: absolute; bottom: -150px; width: 92px; height: 112px; border-radius: 50% 50% 46% 46%;
  display: grid; place-items: center; font-family: var(--f-letter); font-size: 3rem; color: #fff;
  text-shadow: 0 2px 0 #0003; animation: rise linear infinite; z-index: 1;
}
.balloon::after { content: ""; position: absolute; top: 100%; left: 50%; width: 2px; height: 40px; background: #0004; }
.balloon::before { content: ""; position: absolute; top: 18px; right: 20px; width: 16px; height: 24px; border-radius: 50%; background: #fff6; }
.balloon.popped { animation: popb .3s forwards !important; pointer-events: none; }
.balloon.nope { filter: grayscale(.6); }
.boom { position: absolute; font-size: 2.6rem; pointer-events: none; animation: boom .6s forwards; z-index: 2; }

/* result */
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 20px; }
.stars { font-size: 3.6rem; letter-spacing: 6px; }
.stars .off { filter: grayscale(1); opacity: .35; }
.result h2 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 2.3rem; }
.result p { margin: 0; color: var(--ink-soft); }
.score { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.note { font-size: .85rem; color: var(--ink-soft); text-align: center; line-height: 1.6; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 700; z-index: 20;
  animation: fadeup .25s ease;
}
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall 1.8s linear forwards; }

/* lessons 2 & 3 */
.l2head { border-radius: 14px; padding: 8px 14px; font-weight: 800; text-align: center; background: #e4f3ec; }
.l2head.heavy { background: #fde5e3; color: var(--red); }
.l2head.var { background: var(--gold-soft); color: #1b1d45; }
.card-letter .glyph.heavy { color: var(--red); }
.card-letter .badge { position: absolute; bottom: 12px; font-weight: 800; font-size: 1rem; padding: 2px 12px; border-radius: 999px; background: #e4f3ec; }
.card-letter .badge.heavy { background: #fde5e3; color: var(--red); }
.card-letter .badge.var { background: var(--gold-soft); color: #1b1d45; }
.card-letter.k-heavy { border-color: var(--red); }
.card-letter.k-var { border-color: var(--gold); }
.l2note { margin: 0; background: var(--card); border-radius: 14px; padding: 10px 14px; line-height: 1.7; max-width: 420px; }
.st-soon { font-size: .8rem; color: var(--ink-soft); }
.step .lbl small { display: block; font-weight: 600; color: var(--ink-soft); font-size: .8rem; }
.explain { background: var(--card); border-radius: 16px; padding: 10px 14px; box-shadow: 0 3px 0 #d5d7ee; }
.explain summary { font-weight: 800; cursor: pointer; }
.explain audio { width: 100%; margin-top: 10px; }
.l3row { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.l3head { font-family: var(--f-letter); font-size: 4.2rem; line-height: 1.1; background: var(--card); border: 4px solid var(--blue); border-radius: 24px; padding: 6px 28px; display: flex; align-items: center; gap: 10px; color: var(--blue); box-shadow: 0 5px 0 #d5d7ee; }
.l3head.heavy { border-color: var(--red); color: var(--red); }
.l3head small { font-size: 1.4rem; }
.l3words { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.l3word { background: var(--card); border-radius: 18px; padding: 10px 4px; font-family: var(--f-letter); font-size: clamp(1.9rem, 8vw, 2.5rem); line-height: 1.5; box-shadow: 0 4px 0 #d5d7ee; border: 3px solid transparent; }
.l3word.on { border-color: var(--gold); }
.hl { color: var(--blue); }
.hl.red { color: var(--red); }
.spell { margin: 0; min-height: 2.2em; background: var(--card); border-radius: 14px; padding: 8px 14px; text-align: center; font-size: 1.15rem; width: 100%; }

(function () {

/* ---------- data: الدرس الأول — حروف الهجاء المفردة (بترتيب الكتاب) ---------- */
const LETTERS = [

const L3_PAGES = [

// صوت الكلمة من فيديو الدرس الثالث إن وُجد: audio/l3/p<صفحة>-r<صف>-w<كلمة>.mp3، وإلا تُتهجّى بأسماء الحروف
const l3File = (row, k) => `audio/l3/p${row.p + 1}-r${row.r + 1}-w${k + 1}.mp3`;

const l4File = (L, H, s) => `audio/l4/${H.k}/${L.id}${s ? "-s" : ""}.mp3`;

// تهجئة الكلمة كما في الفيديو: «سين فتحة سَ، ميم كسرة مِ، سَمِ، عين فتحة عَ، سَمِعَ»
async function spellH(w, file, onUnit) {
  const tok = ++spellToken;
  const us = unitsOf(w);
  if (onUnit) onUnit(-2, us);
  if (file && await playFile(file)) { if (tok === spellToken && onUnit) onUnit(-1, us); return; }
  for (let i = 0; i < us.length; i++) {
    if (tok !== spellToken) return;
    if (onUnit) onUnit(i, us);
    if (us[i].L && us[i].H) await sayFull(us[i].L, us[i].H);
    if (tok !== spellToken) return;
    if (i > 0) await tts(us.slice(0, i + 1).map(u => u.s).join(""));
    await new Promise(r => setTimeout(r, 150));
  }
  if (tok === spellToken && onUnit) onUnit(-1, us);
}

function stopAudio() {

function tts(text) {
  return new Promise(res => {
    usingTTS = true; markTTS();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ar-SA"; u.rate = 0.75; if (arVoice) u.voice = arVoice;

    u.onend = fin; u.onerror = fin; setTimeout(fin, 3500);
    speechSynthesis.speak(u);
  });
}
function play(file, text) {
  stopAudio();
  return new Promise(res => {
    if (!file || missing.has(file)) return tts(text).then(res);
    const a = new Audio(file); cur = a;
    let done = false;
    const fail = () => { if (done) return; done = true; missing.add(file); tts(text).then(res); };
    a.onended = () => { if (!done) { done = true; res(); } };
    a.onerror = fail;
    a.play().catch(fail);
  });
}
// تشغيل ملف صوتي فقط (بلا صوت آلي): يعيد true إن اشتغل الملف
function playFile(file) {
  stopAudio();
  return new Promise(res => {
    if (!file || missing.has(file)) return res(false);
    const a = new Audio(file); cur = a;
    let done = false;
    const end = (ok, real) => { if (done) return; done = true; if (!ok && real) missing.add(file); res(ok); };
    a.onended = () => end(true);
    a.onerror = () => end(false, true);
    a.play().catch(e => end(false, !e || e.name !== "NotAllowedError"));
  });
}

let actx = null;
function sfx(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    // قفزة بين الجزر: صفير صاعد قصير + رنّة، ودخول الدرس: نغمتان صاعدتان
    if (kind === "hop" || kind === "enter") {
      const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(kind === "hop" ? 420 : 520, t0); o.frequency.exponentialRampToValueAtTime(kind === "hop" ? 980 : 1040, t0 + 0.28);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 0.34);
      [kind === "hop" ? 1318 : 784, kind === "hop" ? 1760 : 1175].forEach((f, i) => {
        const o2 = actx.createOscillator(), g2 = actx.createGain(), t = t0 + 0.3 + i * 0.09;
        o2.type = "triangle"; o2.frequency.value = f;
        g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.09, t + 0.02); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        o2.connect(g2).connect(actx.destination); o2.start(t); o2.stop(t + 0.32);
      });
      return;
    }
    const notes = kind === "ok" ? [660, 880] : kind === "win" ? [523, 659, 784, 1046] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === "bad" ? "square" : "sine"; o.frequency.value = f;
      const t = actx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kind === "bad" ? 0.05 : 0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}

       stageChips: (i) => ["ب","ت","ث"].map(c => c + HARAKAT[i].m).join(" "), stageSub: (i) => HARAKAT[i].title }
};
const AVAILABLE = 4;            // الدروس الجاهزة حالياً

const blankLP = (n) => ({ stages: Array(LDEF[n].stages).fill(false), games: [false, false], best: 0, tries: 0, passedAt: 0 });
function LP(n, who) {
  who = who || P;
  if (n === 1) return who.l1;
  who.lx = who.lx || {};
  if (!who.lx[n]) who.lx[n] = blankLP(n);
  return who.lx[n];
}
const stepsOf = (n) => [
  ...Array.from({ length: LDEF[n].stages }, (_, i) => ({ kind: "stage", i })),
  { kind: "game", i: 0 }, { kind: "game", i: 1 }, { kind: "test" }
];
const stepDone = (s, n) => { const L = LP(n || CUR); return s.kind === "stage" ? !!L.stages[s.i] : s.kind === "game" ? !!L.games[s.i] : L.best >= 8; };
const stepOpen = (idx, n) => !!TEACHER || idx === 0 || stepDone(stepsOf(n || CUR)[idx - 1], n);
const stepName = (s, n) => s.kind === "stage" ? "المرحلة " + STAGE_NAMES[s.i] : s.kind === "game" ? LDEF[n || CUR].games[s.i][0].replace("لعبة: ", "لعبة ") : "اختبار الدرس";
const lessonPassed = (n) => n <= AVAILABLE && LP(n).best >= 8;
const lessonOpen = (n) => n === 1 || !!TEACHER || lessonPassed(n - 1);

/* ---------- إرسال التقدم إلى سجل المعلم ---------- */
function position() {
  for (let n = 1; n <= AVAILABLE; n++) {
    const st = stepsOf(n), k = st.findIndex(s => !stepDone(s, n));
    if (k >= 0) return "الدرس " + ORDINALS[n - 1] + " — " + stepName(st[k], n);
  }
  return "أنهى الدرس " + ORDINALS[AVAILABLE - 1] + " ✓";
}
function progressPct() {
  let done = 0, all = 0;
  for (let n = 1; n <= AVAILABLE; n++) { const st = stepsOf(n); all += st.length; done += st.filter(s => stepDone(s, n)).length; }
  return Math.round(done / all * 100);
}

async function registerOnline(st) {
  const j = await postApi({ action: "student.register", sid: st.id, name: st.name, group: st.group || "", username: st.username });
  if (j.error === "deleted") { removeLocal(st.id, true); return null; }
  if (!j.ok) return null;

/* يطبّق ما في السجل على الطالب المحلي (الاسم، الحلقة، المعلم، اسم المستخدم، التقدّم) */
function applyServer(me, s) {
  const d = s.detail || {};
  if (s.name) me.name = String(s.name);
  if (s.username) me.username = String(s.username);
  me.group = String(s.group || "");
  me.teacher = String(s.teacher || "");
  const reset = Number(d.reset || 0);
  if (reset > (me.l1.resetSeen || 0)) {
    me.l1 = Object.assign(blankL1(), { stages: (d.stages || []).slice(0, 4).map(Boolean).concat([false,false,false,false]).slice(0, 4),
      games: (d.games || []).slice(0, 2).map(Boolean).concat([false,false]).slice(0, 2),
      best: Number(s.best) || 0, tries: Number(s.tries) || 0, resetSeen: reset, passedAt: Number(d.passedAt) || 0 });
    me.lx = {};
    Object.keys(d.lx || {}).forEach(k => { if (LDEF[k]) me.lx[k] = Object.assign(blankLP(+k), d.lx[k]); });
    DB.queue = DB.queue.filter(ev => ev.sid !== me.id);
  } else {
    const L = me.l1;
    L.stages = L.stages.map((v, i) => v || !!(d.stages || [])[i]);
    L.games = L.games.map((v, i) => v || !!(d.games || [])[i]);
    L.best = Math.max(L.best, Number(s.best) || 0);
    L.tries = Math.max(L.tries || 0, Number(s.tries) || 0);
    const pa = Number(d.passedAt) || 0;
    if (pa && (!L.passedAt || pa < L.passedAt)) L.passedAt = pa;
    // الدروس 2 فما بعد

      a.games = a.games.map((v, i) => v || !!(b.games || [])[i]);
      a.best = Math.max(a.best || 0, Number(b.best) || 0);
      a.tries = Math.max(a.tries || 0, Number(b.tries) || 0);

function drawTrails() {
  $app.querySelectorAll(".trail").forEach(tr => {
    const W = tr.clientWidth, cur = +tr.dataset.cur, row = +tr.dataset.row || TRAIL_ROW, top = +tr.dataset.top || 0;
    const pts = [...tr.querySelectorAll(".tstop")].map((st, i) => [TRAIL_X[i % TRAIL_X.length] * W, i * row + top + 42]);
    if (!W || pts.length < 2) return;
    if (tr.classList.contains("sky")) return drawSky(tr, pts, cur, W);
    const seg = (a, b) => { let d = `M${pts[a][0]},${pts[a][1]}`; for (let i = a + 1; i <= b; i++) { const p = pts[i - 1], q = pts[i], m = (q[1] - p[1]) / 2; d += ` C${p[0]},${p[1] + m} ${q[0]},${q[1] - m} ${q[0]},${q[1]}`; } return d; };
    const k = Math.min(cur, pts.length - 1), last = pts.length - 1;
    let svg = `<path class="road" d="${seg(0, last)}"/>`;
    if (k > 0) svg += `<path class="road done" d="${seg(0, k)}"/>`;
    svg += `<path class="lane" d="${seg(0, last)}"/>`;
    if (k > 0) svg += `<path class="lane done" d="${seg(0, k)}"/>`;
    tr.querySelector(".trail-svg").innerHTML = svg;

  const H = tr.clientHeight, inside = tr.classList.contains("inside");
  const states = (tr.dataset.states || "").split(","), zones = (tr.dataset.zones || "").split(",").map(Number);

    const [g1, g2, tree] = ZONE_GRASS[z % ZONE_GRASS.length], lock = st === "locked";
    const trees = [[-46, -9, 9], [48, -10, 8], [-34, -13, 7]].map(([tx, ty, r], j) => rnd(i * 7 + j) > .35 || j === 0 ? `<rect x="${tx - 2}" y="${ty - 3}" width="4" height="12" fill="#7d5c3f"/><circle cx="${tx}" cy="${ty - 9}" r="${r}" fill="${lock ? "#c9cbe0" : tree}"/>` : "").join("");
    return `<g transform="translate(${x},${y}) scale(${sc})" class="isl ${lock ? "locked" : ""}">
      <ellipse cx="6" cy="78" rx="44" ry="10" fill="#23266b" opacity=".08"/>
      <path d="M-72,0 Q-62,40 -26,62 Q0,94 22,64 Q56,40 72,0 Z" fill="${lock ? "#c4b6a8" : "#9b7653"}"/>
      <path d="M-30,60 L-12,98 L2,68 Z" fill="${lock ? "#b9ab9d" : "#8a6646"}"/>
      <path d="M10,66 L24,88 L30,58 Z" fill="${lock ? "#b9ab9d" : "#8a6646"}"/>
      <ellipse cx="0" cy="0" rx="76" ry="21" fill="${lock ? "#d6d8ea" : g1}"/>
      <ellipse cx="0" cy="-3" rx="68" ry="15" fill="${lock ? "#e3e5f1" : g2}"/>${trees}</g>`;
  };
  let svg = `<defs><linearGradient id="skyg${inside ? "i" : ""}" x1="0" y1="0" x2="0" y2="1">${inside
      ? `<stop offset="0" stop-color="#ffe3b8"/><stop offset=".45" stop-color="#fff1d8"/><stop offset="1" stop-color="#e6f3ff"/>`

    <circle cx="${W * .82}" cy="80" r="44" fill="#ffd23f" opacity=".5" filter="url(#sblur)"/>`;
  // طبقة بعيدة: غيوم ضبابية وجزر صغيرة باهتة
  for (let i = 0; i < Math.ceil(H / 260); i++) {
    svg += `<g filter="url(#sblur)" opacity=".55">${cloud(rnd(i) * (W - 80), 160 + i * 260, .7 + rnd(i + 3) * .3, "cl far")}</g>`;
    if (i % 2 === 0) svg += `<g opacity=".3">${island(rnd(i + 11) > .5 ? W * .12 : W * .88, 260 + i * 260, .36, "", (i + 1) % 4, i + 50)}</g>`;

    svg += `<path class="hopline ${i < cur ? "done" : ""}" d="M${x1},${y1 - 10} Q${mx},${my} ${x2},${y2 - 10}"/>`;
  }
  // الجزر تحت المحطات (المحطة الحالية أكبر قليلاً)
  pts.forEach(([x, y], i) => {

    svg += island(x, y + 34, k * (i === cur ? 1.1 : big ? 1.15 : 1), st, zones[i] || 0, i);
  });
  // طبقة قريبة: غيوم على الأطراف
  for (let i = 0; i < Math.ceil(H / 420); i++) svg += cloud(i % 2 ? W - 70 : -50, 300 + i * 420, 1.05, "cl near");
  if (!inside && cur < pts.length) svg += `<rect x="0" y="${pts[Math.min(cur + 1, pts.length - 1)][1] + 40}" width="${W}" height="${H}" fill="#fff" opacity=".22"/>`;

/* النقطة المسافرة تقفز من الجزيرة الحالية إلى الجزيرة المختارة، مع صوت */
let travelling = false;
function travel(tr, from, to, done, sound) {
  if (travelling) return;
  sfx(sound || "hop");
  const stops = tr.querySelectorAll(".tstop"), a = stops[Math.min(from, stops.length - 1)], b = stops[to];
  if (!a || !b || matchMedia("(prefers-reduced-motion: reduce)").matches || a === b) { travelling = true; return setTimeout(() => { travelling = false; done(); }, a === b ? 380 : 150); }
  const r = tr.getBoundingClientRect(), pa = a.getBoundingClientRect(), pb = b.getBoundingClientRect();
  const P0 = [pa.left - r.left, pa.top - r.top + 42], P1 = [pb.left - r.left, pb.top - r.top + 42], C = [(P0[0] + P1[0]) / 2, Math.min(P0[1], P1[1]) - 70];
  const dot = document.createElement("span"); dot.className = "traveler"; tr.appendChild(dot);
  const frames = Array.from({ length: 13 }, (_, i) => { const t = i / 12, u = 1 - t;
    return { transform: `translate(${u * u * P0[0] + 2 * u * t * C[0] + t * t * P1[0] - 11}px, ${u * u * P0[1] + 2 * u * t * C[1] + t * t * P1[1] - 11}px) scale(${1 + Math.sin(t * Math.PI) * .5})` }; });
  travelling = true;
  b.scrollIntoView({ block: "center", behavior: "smooth" });
  dot.animate(frames, { duration: 700, easing: "ease-in-out", fill: "forwards" }).onfinish = () => { travelling = false; done(); };
}

function Lesson() {

  const STEPS = stepsOf(n);

/* --- محرك الأسئلة: كل سؤال = ما يُعرض + ما يُسمع + خيارات + الإجابة --- */
const opt = (k, html, cls) => ({ k, html: html == null ? k : html, cls: cls || "" });

const CLASS_OPTS = [opt("heavy", `🐘<small>مفخّم</small>`, "cls"), opt("light", `🐦<small>مرقّق</small>`, "cls")];
const qClass = (t) => ({ hint: "class", ask: `<div class="target">${t.c}</div>`, speak: () => sayLetter(t),

  // kind: heavy = اختر المفخّم بين مرقّقات، light = العكس، var = اختر الحرف المتغيّر
  let ans, others;
  if (kind === "heavy") { ans = byChar(pick([...HEAVY], 1)[0]); others = shuffle([...LIGHT_TWIN[ans.c]].map(byChar)).concat(pick([..."بتثجدذزسشعفكمنهو"].map(byChar), 3)).filter((x, i, a) => a.indexOf(x) === i && x !== ans).slice(0, 3); }
  else if (kind === "light") { ans = byChar(pick([..."بتثجحدذزسشعفكمنهو"], 1)[0]); others = pick([...HEAVY].map(byChar), 3); }
  else { ans = byChar(pick([..."ارل"], 1)[0]); others = pick([...HEAVY, ..."بتسم"].map(byChar), 3); }
  const label = { heavy: "🐘 اختر الحرف المفخّم", light: "🐦 اختر الحرف المرقّق", var: "🔄 اختر الحرف الذي يتغيّر" }[kind];
  const say = { heavy: "اِخْتَرِ الْحَرْفَ الْمُفَخَّم", light: "اِخْتَرِ الْحَرْفَ الْمُرَقَّق", var: "اِخْتَرِ الْحَرْفَ الَّذِي يَتَغَيَّر" }[kind];
  return { hint: "pick", key: `${{ heavy: "اختر المفخّم", light: "اختر المرقّق", var: "اختر المتغيّر" }[kind]} «${ans.c}»`, ask: `<div class="asktext">${label}</div>`, speak: () => play(null, say),
    opts: shuffle([ans, ...others]).map(o => opt(o.c)), ans: ans.c };

function l2Practice(S) {
  if (S.kind === "var") return [0, 1, 2, 3, 4].map(() => qPick("var"));
  const pool = [...S.letters].map(byChar);
  const mix = S.kind === "heavy" ? [..."بتسدكه"].map(byChar) : [...HEAVY].map(byChar);

// الدرس الثالث
const L3_ROWS = L3_PAGES.flat().filter(r => r.t !== "لا");
function qShape(r) {
  const w = pick(r.words, 1)[0], t = byChar(r.t);
  return { hint: "shape", ask: `<div class="word-target">${hlWord(w, r.t)}</div>`, speak: () => sayL3Word(r, w),
    opts: shuffle([t, ...distractors(t, 4).filter(o => !(r.t === "ء" && o.c === "ا")).slice(0, 3)]).map(o => opt(o.c)), ans: t.c };
}
function qWordHas(r) {
  const w = pick(r.words, 1)[0];
  const others = pick(L3_ROWS.filter(x => x.t !== r.t).flatMap(x => x.words).filter(x => !hasLetter(x, r.t) && x.length <= 5), 2);
  return { hint: "wordhas", ask: `<span style="font-size:2.4rem">👂</span>`, speak: () => sayLetter(byChar(r.t)),
    opts: shuffle([w, ...others]).map(x => opt(x, x, "word")), ans: w, cols: 3, key: `أين الحرف «${r.t}»` };
}

/* --- الدرس الرابع: شبكة المقاطع + كلمات التدريب --- */
function Stage4() {
  const H = HARAKAT[screen.i], words = L4_WORDS[screen.i];
  screen.tab = screen.tab || "ltr";
  screen.seenL = screen.seenL || new Set();
  screen.seenW = screen.seenW || new Set();

  let html = bar(`المرحلة ${STAGE_NAMES[screen.i]}: ${H.title}`, "lesson",
    `<span class="pill">${screen.tab === "ltr" ? screen.seenL.size + " من " + L4_LETTERS.length : screen.seenW.size + " من " + words.length}</span>`);
  html += hint(screen.tab === "ltr" ? "l4learn" : "l4words");
  html += `<div class="learn">
    <div class="l4head"><span class="l4mark">ـ${H.m}ـ</span><p>${H.note}</p></div>
    <div class="tabs" role="tablist">
      <button role="tab" class="tab ${screen.tab === "ltr" ? "on" : ""}" data-tab="ltr" aria-selected="${screen.tab === "ltr"}">١ الحروف${screen.seenL.size === L4_LETTERS.length ? " ✓" : ""}</button>
      <button role="tab" class="tab ${screen.tab === "words" ? "on" : ""}" data-tab="words" aria-selected="${screen.tab === "words"}">٢ الكلمات${screen.seenW.size >= needW ? " ✓" : ""}</button>
    </div>`;
  if (screen.tab === "ltr") {
    html += `<button class="go" id="playall">${screen.playing ? "⏹️ إيقاف" : "▶️ اسمعها كلها"}</button>
      <p class="spell" id="spell">اضغط على المقطع لتسمعه: «با ${H.name} ${sylOf(LETTERS[1], H)}»</p>
      <div class="sylgrid">${L4_LETTERS.map((l, k) =>
        `<button class="syl ${isHeavy(l.c) ? "heavy" : ""} ${screen.seenL.has(k) ? "seen" : ""}" data-k="${k}" aria-label="${l.name} ${H.name}">${l === TAM ? "ـ" : ""}${sylOf(l, H)}</button>`).join("")}</div>
      <p class="muted l4legend"><span class="hv">●</span> الحروف المفخّمة بالأحمر</p>`;
  } else {
    html += `<p class="spell" id="spell">اضغط على كلمة لتسمع تهجئتها</p>
      <div class="l4words">${words.map((w, k) =>
        `<button class="l3word ${screen.seenW.has(k) ? "seen" : ""}" data-w="${k}">${unitsHtml(unitsOf(w), -1, true)}</button>`).join("")}</div>`;
  }
  html += ready ? `<button class="go gold" id="practice">🎯 هيا نتمرّن</button>`
    : `<p class="muted">${screen.seenL.size < L4_LETTERS.length ? "استمع إلى كل الحروف" : "استمع إلى " + needW + " كلمات على الأقل"} ثم تظهر لك «هيا نتمرّن»</p>`;
  html += `</div>`;
  $app.innerHTML = html;

  const sp = document.getElementById("spell");
  const stopAll = () => { spellToken++; stopAudio(); screen.playing = false; };
  $app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { stopAll(); screen.tab = b.dataset.tab; render(); });
  const mark = (k) => {
    screen.seenL.add(k);
    $app.querySelectorAll(".syl").forEach(x => x.classList.toggle("now", +x.dataset.k === k));
    const b = $app.querySelector(`.syl[data-k="${k}"]`); if (b) { b.classList.add("seen"); b.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    const L = L4_LETTERS[k], pill = $app.querySelector(".bar .pill");
    if (pill) pill.textContent = screen.seenL.size + " من " + L4_LETTERS.length;
    sp.innerHTML = `<b>${sylOf(L, H)}</b> ${L.name} ${H.name} ${sylOf(L, H)}`;
  };
  $app.querySelectorAll(".syl").forEach(b => b.onclick = () => {
    stopAll(); const k = +b.dataset.k; mark(k);
    const tok = spellToken;
    sayFull(L4_LETTERS[k], H).then(() => { if (tok === spellToken && screen.name === "stage" && screen.seenL.size === L4_LETTERS.length && !$app.querySelector("#practice") && !TEACHER) render(); });
  });
  const pa = document.getElementById("playall");
  if (pa) pa.onclick = async () => {
    if (screen.playing) { stopAll(); return render(); }
    stopAll(); screen.playing = true; pa.textContent = "⏹️ إيقاف";
    const tok = spellToken;
    for (let k = 0; k < L4_LETTERS.length; k++) {
      if (tok !== spellToken || screen.name !== "stage") return;
      mark(k);
      await sayFull(L4_LETTERS[k], H);
      await new Promise(r => setTimeout(r, 250));
    }
    if (tok === spellToken && screen.name === "stage") { screen.playing = false; render(); }
  };
  $app.querySelectorAll(".l4words .l3word").forEach(b => b.onclick = () => {
    const k = +b.dataset.w, w = words[k];
    $app.querySelectorAll(".l4words .l3word").forEach(x => x.classList.toggle("on", x === b));
    const before = screen.seenW.size;
    spellH(w, `audio/l4/${H.k}/w${k + 1}.mp3`, (i, us) => {
      if (screen.name !== "stage") return;
      b.innerHTML = unitsHtml(us, i, true);
      sp.innerHTML = i === -2 ? "🔊 ..." : i === -1 ? `<b>${w}</b> ✓` :
        `<b>${unitsHtml(us.slice(0, i + 1), i, false)}</b> ${us[i].L ? us[i].L.name : ""} ${us[i].H ? us[i].H.name : ""}`;
      if (i === -1) {
        screen.seenW.add(k); b.classList.add("seen");

        if (before < needW && screen.seenW.size >= needW) render();

/* أسئلة الدرس الرابع */
const randL4 = () => pick(L4_LETTERS.slice(0, 28), 1)[0];
// اسمع المقطع، واختر الحرف الصحيح بالحركة نفسها
function qSylListen(L, H) {
  const ds = distractors(L.c === "ء" ? LETTERS[28] : L, 2, LETTERS.slice(1)).filter(x => x.c !== "ا").slice(0, 2);
  return { hint: "l4listen", ask: `<span style="font-size:2.4rem">👂</span>`, speak: () => saySyl(L, H),
    opts: shuffle([L, ...ds]).map(o => opt(sylOf(o, H))), ans: sylOf(L, H), cols: 3 };
}
// اسمع المقطع، واختر حركته: بَ بِ بُ
function qHListen(L, H, hs) {
  hs = hs || HARAKAT;
  return { hint: "l4haraka", ask: `<span style="font-size:2.4rem">👂</span>`, speak: () => saySyl(L, H),
    opts: hs.map(h => opt(sylOf(L, h))), ans: sylOf(L, H), cols: hs.length === 3 ? 3 : 2 };
}
// ما اسم الحركة؟
const HNAME_OPTS = HARAKAT.map(h => opt(h.k, `<span class="hm">ـ${h.m}ـ</span><small>${h.name}</small>`, "cls hname"));
const qHName = (L, H) => ({ hint: "l4name", ask: `<div class="target">${sylOf(L, H)}</div>`, speak: () => play("audio/prompts/haraka.mp3", "مَا اسْمُ هَذِهِ الْحَرَكَة؟"),
  opts: HNAME_OPTS, ans: H.k, cols: 3, key: `اسم الحركة «${sylOf(L, H)}»` });
// المقطع الملوّن داخل الكلمة: ما هو؟
function qHInWord(maxStage) {
  const w = pick(L4_WORDS.slice(0, maxStage + 1).flat(), 1)[0];
  const us = unitsOf(w), k = pick(us.map((u, i) => i).filter(i => us[i].L && us[i].H), 1)[0], u = us[k];
  return { hint: "l4word", ask: `<div class="word-target">${unitsHtml(us, k, false).replace('class="now"', 'class="hl"')}</div>`,
    speak: () => play("audio/prompts/colored.mp3", "مَا الْمَقْطَعُ الْمُلَوَّن؟"),
    opts: HARAKAT.map(h => opt(sylOf(u.L, h))), ans: sylOf(u.L, u.H), cols: 3 };
}
function l4Practice(i) {
  const H = HARAKAT[i];
  if (i === 0) return pick(L4_LETTERS.slice(0, 28), 5).map(L => qSylListen(L, H));
  const hs = HARAKAT.slice(0, i + 1);
  return shuffle([...pick(L4_LETTERS.slice(0, 28), 3).map(L => qSylListen(L, H)), qHListen(randL4(), H, hs), qHName(randL4(), H)]);
}

function startQuiz(cfg) { cfg.lesson = cfg.lesson || CUR; go("quiz", { cfg, q: 0, score: 0, firstTry: true, answers: [], answered: false }); }
// اسم السؤال في إحصاء «أصعب الأسئلة» (يراه المعلم)
const QKEY = { listen: "اسمع واختر", same: "طابق الشكل", shape: "الحرف الملوّن", l4listen: "اسمع المقطع", l4haraka: "اسمع الحركة", l4word: "المقطع الملوّن" };
const qKey = (Q) => Q.key || `${QKEY[Q.hint] || Q.hint} «${Q.ans}»`;
function Quiz() {
  const { cfg } = screen;
  const Q = cfg.questions[screen.q];
  const pct = Math.round(screen.q / cfg.questions.length * 100);
  let html = bar(cfg.title, cfg.back, `<span class="pill">${screen.q + 1} من ${cfg.questions.length}</span>`);
  html += `<div class="progress"><i style="width:${pct}%"></i></div>`;
  html += hint(cfg.mode === "test" ? "test" : Q.hint);
  html += `<div class="ask">${Q.ask}<button class="speak ${Q.ask.includes("👂") ? "" : "small"}" id="rep" aria-label="أعد الصوت">🔊</button></div>`;
  const cols = Q.cols || (Q.opts.length === 3 ? 3 : 2);
  html += `<div class="opts ${cols === 3 ? "three" : ""}" id="opts">${Q.opts.map((o, i) =>
    `<button class="opt ${o.cls}" data-i="${i}">${o.html}</button>`).join("")}</div>`;
  $app.innerHTML = html;

  const ask = () => Q.speak();
  document.getElementById("rep").onclick = ask;
  ask();
  const optsEl = document.getElementById("opts");
  optsEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = Q.opts[+b.dataset.i].k === Q.ans;
    if (!screen.answered) { screen.answered = true; (screen.answers = screen.answers || []).push([qKey(Q), ok ? 1 : 0]); }
    if (ok) {
      if (screen.firstTry) screen.score++;
      b.classList.add("right"); optsEl.classList.add("lock"); sfx("ok");
      setTimeout(nextQ, 800);
    } else {
      b.classList.add("wrong"); sfx("bad");
      screen.firstTry = false;
      if (cfg.mode === "test") {
        optsEl.classList.add("lock");
        optsEl.querySelector(`[data-i="${Q.opts.findIndex(o => o.k === Q.ans)}"]`).classList.add("reveal");
        setTimeout(nextQ, 1300);
      } else {
        setTimeout(() => { b.classList.remove("wrong"); ask(); }, 600);
      }
    }
  });
  function nextQ() {
    spellToken++;
    if (screen.q + 1 < cfg.questions.length) { screen.q++; screen.firstTry = true; screen.answered = false; stopAudio(); render(); }
    else finish(cfg, screen.score, cfg.questions.length, screen.answers);
  }
}

function finish(cfg, score, total, answers) {
  const n = cfg.lesson || CUR, L = LP(n);
  if (cfg.mode === "practice") { L.stages[cfg.stage] = true; }
  if (cfg.mode === "game") { L.games[cfg.game] = true; }
  if (cfg.mode === "test") {
    L.best = Math.max(L.best, score); L.tries = (L.tries || 0) + 1;
    if (score >= 8 && !L.passedAt) L.passedAt = Date.now();
  }
  save();
  const label = "الدرس " + ORDINALS[n - 1] + " — " + (cfg.mode === "practice" ? stepName({ kind: "stage", i: cfg.stage }, n)
    : cfg.mode === "game" ? stepName({ kind: "game", i: cfg.game }, n) : "الاختبار");
  report(label, score, total, false, answers);
  go("result", { cfg, score, total });
}

/* --- لعبة البالونات --- */
function startBalloons() {
  const rounds = pick(LETTERS, 6);
  go("balloons", { rounds, r: 0, hits: 0 });
}
function Balloons() {
  const T = screen.rounds[screen.r];
  const others = distractors(T, 4);
  const items = shuffle([T, T, ...others]);
  const colors = ["#d9485f","#2a5fd0","#17804f","#f08a24","#8e44ad","#d6336c"];
  let html = bar("لعبة البالونات", "lesson", `<span class="pill">${screen.r + 1} من ${screen.rounds.length}</span>`);
  html += hint("pop");
  html += `<div class="ask" style="min-height:90px"><button class="speak" id="rep" aria-label="أعد الصوت">🔊</button>
    <span class="pill" id="need">🎈 × 2</span></div>`;
  html += `<div class="sky" id="sky">${items.map((l, k) => {
    const left = 4 + (k % 6) * 15.5;
    const dur = 7 + (k % 3) * 1.3;
    const delay = -(k * 1.25);
    return `<button class="balloon" data-c="${l.c}" style="left:${left}%;background:${colors[k % colors.length]};animation-duration:${dur}s;animation-delay:${delay}s">${l.c}</button>`;
  }).join("")}</div>`;
  $app.innerHTML = html;
  let left = 2;
  const ask = () => sayLetter(T);
  document.getElementById("rep").onclick = ask;
  ask();
  const sky = document.getElementById("sky");
  sky.querySelectorAll(".balloon").forEach(b => b.onclick = (ev) => {
    if (b.dataset.c === T.c) {
      sfx("ok"); b.classList.add("popped");
      const r = sky.getBoundingClientRect(), br = b.getBoundingClientRect();
      const boom = document.createElement("span"); boom.className = "boom"; boom.textContent = "💥";
      boom.style.left = (br.left - r.left + 20) + "px"; boom.style.top = (br.top - r.top + 20) + "px";
      sky.appendChild(boom);
      left--; document.getElementById("need").textContent = left ? "🎈 × " + left : "✓";
      if (!left) setTimeout(() => {
        if (screen.r + 1 < screen.rounds.length) { screen.r++; render(); }
        else finish({ mode: "game", game: 1, back: "lesson", title: "لعبة البالونات", lesson: 1 }, 6, 6);
      }, 700);
    } else {
      sfx("bad"); b.classList.add("nope"); setTimeout(() => b.classList.remove("nope"), 500); ask();
    }
  });
}

/* --- الشهادة --- */

/* --- النتيجة --- */
function Result() {
  const { cfg, score, total } = screen;
  let stars, title, msg, pass = true;
  if (cfg.mode === "test") {
    stars = starsFor(score); pass = score >= 8;
    title = pass ? "أحسنت! نجحت 🎉" : "قاربت! حاول مرة أخرى";
    msg = pass ? "فُتح لك الدرس التالي." : "تحتاج 8 إجابات صحيحة من 10. راجع المراحل ثم أعد الاختبار.";
  } else {
    stars = score >= total ? 3 : score >= total * 0.6 ? 2 : 1;
    title = "أحسنت!"; msg = cfg.mode === "practice" ? "أنهيت هذه المرحلة." : "أنهيت اللعبة.";
  }
  let html = `<div class="result">
    <div class="stars">${[0,1,2].map(k => `<span class="${k < stars ? "" : "off"}">⭐</span>`).join("")}</div>
    <h2>${title}</h2>
    ${cfg.mode !== "game" || cfg.game === 0 ? `<div class="score">${score} من ${total}</div>` : ""}
    <p>${msg}</p>
    <button class="go" data-go="lesson">متابعة ⬅</button>
    ${cfg.mode === "test" && !pass ? `<button class="go gold" id="retry">🔁 أعد الاختبار</button>` : ""}
    ${cfg.mode === "test" && pass ? `<button class="go gold" data-cert="${(cfg.lesson || CUR) - 1}">🏅 استلم شهادتك</button>` : ""}
  </div>`;
  $app.innerHTML = html;
  if (pass) { sfx("win"); confetti(); setTimeout(() => sayPrompt("great"), 500); }
  else { setTimeout(() => sayPrompt("again"), 300); }
  const rt = document.getElementById("retry"); if (rt) rt.onclick = () => startLessonTest(cfg.lesson || CUR);
}

function startListenGame() {
  startQuiz({ title: "لعبة: اسمع واختر", mode: "game", game: 0, back: "lesson", lesson: 1,
    questions: pick(LETTERS, 10).map(t => qListen(t, shuffle([t, ...distractors(t, 3)]))) });
}
function startGame(n, g) {
  if (n === 1) return g === 0 ? startListenGame() : startBalloons();
  const title = LDEF[n].games[g][0];
  let questions;
  if (n === 2) questions = g === 0
    ? shuffle([...pick([...HEAVY], 5), ...pick([..."ءبتثجحدذزسشعفكمنهوي"], 7)]).map(c => qClass(byChar(c)))
    : [0, 1, 2, 3, 4, 5, 6, 7].map(() => qPick("heavy"));
  else if (n === 4) questions = g === 0
    ? Array.from({ length: 10 }, () => qHListen(randL4(), pick(HARAKAT, 1)[0]))
    : Array.from({ length: 10 }, () => qHName(randL4(), pick(HARAKAT, 1)[0]));
  else questions = g === 0 ? pick(L3_ROWS, 10).map(qShape) : pick(L3_ROWS, 8).map(qWordHas);
  startQuiz({ title, mode: "game", game: g, back: "lesson", lesson: n, questions });
}
function startLessonTest(n) {
  let questions;
  if (n === 1) questions = pick(LETTERS, 10).map((t, k) => (k % 5 === 4 || k % 5 === 1 ? qSame : qListen)(t, shuffle([t, ...distractors(t, 3)])));
  else if (n === 2) questions = shuffle([...shuffle([...pick([...HEAVY], 3), ...pick([..."ءبتثجحدذزسشعفكمنهوي"], 3)]).map(c => qClass(byChar(c))),
    qPick("heavy"), qPick("heavy"), qPick("light"), qPick("var")]);
  else if (n === 4) questions = shuffle([
    ...Array.from({ length: 4 }, () => qHListen(randL4(), pick(HARAKAT, 1)[0])),
    ...Array.from({ length: 3 }, () => qHName(randL4(), pick(HARAKAT, 1)[0])),
    ...Array.from({ length: 3 }, () => qHInWord(2))]);
  else questions = shuffle([...pick(L3_ROWS, 6).map(qShape), ...pick(L3_ROWS, 4).map(qWordHas)]);
  startQuiz({ title: "اختبار الدرس " + ORDINALS[n - 1], mode: "test", back: "lesson", lesson: n, questions });
}

/* ---------- global clicks ---------- */
$app.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  if (e.target.closest("#texit")) return exitTeacher();
  const cb = e.target.closest("[data-cert]"); if (cb) return go("cert", { lesson: +cb.dataset.cert });
  const kid = e.target.closest("[data-student]");
  if (kid) {
    TEACHER = null; P = DB.students[kid.dataset.student]; DB.current = P.id; setSession(P.id); P.seen = Date.now(); save();
    report("دخول"); syncUp(); return go("home");
  }
  const ls = e.target.closest("[data-lesson]");
  if (ls) {
    const n = +ls.dataset.lesson + 1;
    if (!lessonOpen(n)) return toast("🔒 أنهِ الدرس السابق أولاً");
    if (n > AVAILABLE) return toast("الدرس " + ORDINALS[n - 1] + " قيد الإعداد ✨");
    const tr = ls.closest(".trail");
    if (tr) return travel(tr, +tr.dataset.cur, n - 1, () => { CUR = n; go("lesson", { enter: true }); });
    CUR = n; return go("lesson");
  }
  const st = e.target.closest("[data-step]");
  if (st && !st.disabled) {
    const tr = st.closest(".trail"), idx = +st.dataset.step;
    if (tr && !st.dataset.went) return travel(tr, +tr.dataset.cur, idx, () => { st.dataset.went = 1; st.click(); }, "enter");
    const s = stepsOf(CUR)[idx];
    if (s.kind === "stage") {
      go("stage", { i: s.i });
      if (CUR === 1) setTimeout(() => sayLetter(STAGES[s.i][0]), 150);
      if (CUR === 2) setTimeout(() => sayLetter(byChar(L2_STAGES[s.i].letters[0])), 150);
    }
    else if (s.kind === "game") startGame(CUR, s.i);
    else startLessonTest(CUR);
  }
  if (e.target.closest("#signout")) return signOut();
  if (e.target.closest("#keepme")) { P.temp = false; save(); toast("حُفظ اسمك على هذا الجهاز ✓"); return render(); }
  if (e.target.closest("#lang")) {
    DB.lang = LANGS[(LANGS.indexOf(DB.lang) + 1) % LANGS.length]; save(); render();
    toast(DB.lang === "ar" ? "الإرشادات: العربية" : "Parent hints: English");
  }
});

}
// طالب مؤقت من جلسة سابقة (أُغلق التطبيق دون «احفظني»): لا يُفتح، ويُزال بعد إرسال تقدّمه
if (P && P.temp && P.id !== sessionId()) { P = null; DB.current = null; screen = { name: "login" }; }
if (P) { P.seen = Date.now(); save(); }
if (location.hash === "#teacher") screen = { name: "tlogin" };
// رابط بطاقة الدخول: index.html#u=اسم_المستخدم
if (/^#u=/.test(location.hash)) {
  const u = decodeURIComponent(location.hash.slice(3));
  history.replaceState(null, "", location.pathname);
  const local = Object.values(DB.students).find(x => normU(x.username) === normU(u));
  if (local && !local.temp) { TEACHER = null; P = local; DB.current = local.id; setSession(local.id); save(); screen = { name: "home" }; }
  else { P = null; screen = { name: "login", tab: "user", prefill: u }; }
}
render();
if (location.hash === "#teacher") autoTeacher();
try { history.replaceState({ rh: screen.name, l: CUR, d: {} }, ""); } catch (e) {}
flush().then(() => { purgeTemp(); if (screen.name === "login") render(); if (P && !P.pending && ["home"].includes(screen.name)) render(); }); syncDown(); loadGroups();
window.addEventListener("online", () => { syncDown(); loadGroups(); });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
