<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجربة تقييم النطق</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/rehla.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&family=Noto+Naskh+Arabic:wght@700&display=swap">
<style>
/* صفحة تجربة: هل يستطيع الموقع أن يميّز «بَ / بِ / بُ» بمقارنة صوت الطفل بتسجيلات مرجعية؟ (كل شيء داخل الجهاز) */
:root {
  --bg: #f7f7fc; --card: #fff; --ink: #1b1d45; --soft: #565a86; --line: #dcddf0;
  --navy: #23266b; --gold: #ffd23f; --gold-soft: #fff6d1; --red: #c8233a; --green: #17804f;
  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --f-title: "Lalezar", var(--f-ui); --f-letter: "Noto Naskh Arabic", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 1.8rem; color: var(--navy); }
h2 { margin: 0 0 8px; font-size: 1.1rem; }
p { margin: 0; line-height: 1.7; }
.muted { color: var(--soft); font-size: .92rem; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.tabs { display: flex; gap: 8px; }
.tab { flex: 1; border: 0; border-radius: 14px; padding: 12px; font: inherit; font-weight: 800; background: #eceefa; color: var(--soft); cursor: pointer; }
.tab.on { background: var(--navy); color: #fff; }
button { font: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 14px; padding: 10px 16px; font-weight: 800; background: var(--navy); color: #fff; }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 4px 0 #d9a800; }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fbfbff; }
.item.ok { border-color: #b9e4c8; background: #f2fbf5; }
.syl { font-family: var(--f-letter); font-size: 2.6rem; line-height: 1.6; }
.row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
.syl.spl { font-size: 1.15rem; text-align: center; line-height: 2; }
.big.spl { font-size: clamp(2.4rem, 11vw, 3.4rem); }
.big { font-family: var(--f-letter); font-size: clamp(5rem, 28vw, 8rem); line-height: 1.5; text-align: center; color: var(--navy); }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--red); color: #fff; font-size: 2.4rem; box-shadow: 0 6px 0 #8f1a2a; }
.mic.rec { animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 6px 0 #8f1a2a, 0 0 0 14px #c8233a33; } }
.meter { height: 8px; border-radius: 99px; background: #eceefa; overflow: hidden; width: 100%; }
.meter i { display: block; height: 100%; width: 0; background: var(--red); }
.result { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.verdict { font-size: 1.4rem; font-weight: 800; }
.verdict.good { color: var(--green); } .verdict.bad { color: var(--red); }
.bars { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.bar { display: grid; grid-template-columns: 3.2rem 1fr 3rem; gap: 8px; align-items: center; }
.bar b { font-family: var(--f-letter); font-size: 1.4rem; text-align: center; }
.bar .t { height: 10px; border-radius: 99px; background: #eceefa; overflow: hidden; } .bar .t i { display: block; height: 100%; background: var(--navy); }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.score div { background: #f5f6fd; border-radius: 12px; padding: 8px; } .score b { display: block; font-size: 1.6rem; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { display: inline-flex; gap: 6px; align-items: center; background: #f3f4fb; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 600; }
.note { background: var(--gold-soft); border-radius: 12px; padding: 10px 12px; }
textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
.err { color: var(--red); font-weight: 700; }
@media (max-width: 480px) { .syl { font-size: 2.1rem; } }
@media (prefers-reduced-motion: reduce) { .mic.rec { animation: none; outline: 4px solid #c8233a55; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(function () {
"use strict";
/* ---------- المقاطع ---------- */
const LET = ["ب", "ت", "س", "م"], HAR = [["َ", "فتحة"], ["ِ", "كسرة"], ["ُ", "ضمة"]];
const NAMES = { "ب": "باء", "ت": "تاء", "س": "سين", "م": "ميم" };
const ITEMS = []; LET.forEach(l => HAR.forEach(([m, n]) => ITEMS.push({ k: l + m, l, h: n, sp: NAMES[l] + " " + n + " " + l + m })));
// نوعا القراءة: «syl» المقطع وحده (بِ)، و«sp» التهجئة كما في الكتاب (باء كسرة بِ)
const refKey = (k, kind) => kind === "sp" ? "sp:" + k : k;
const refsOf = (k, kind) => DB.refs[refKey(k, kind)] || [];
const KEY = "pron-test-v1";
let DB = { refs: {}, log: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.refs) DB = Object.assign(DB, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { alert("امتلأت ذاكرة المتصفح: احذف بعض التسجيلات."); } };
const UI = { tab: Object.keys(DB.refs).length ? "test" : "ref", kind: "syl", scope: "letter", target: null, last: null, busy: false, msg: "" };
const lastAudio = {};
const root = document.getElementById("root");
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- التسجيل: ثانيتان ونصف، ثم تحويل إلى 16 كيلوهرتز أحادي ---------- */
const SR = 16000, recMs = () => UI.kind === "sp" ? 4500 : 2500;
let stream = null;
async function record(onLevel) {
  const REC_MS = recMs();
  stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 } });
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize);
  const types = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", ""];
  const type = types.find(t => !t || (window.MediaRecorder && MediaRecorder.isTypeSupported(t)));
  const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [];
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const t0 = performance.now();
  let raf = 0; const tick = () => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); onLevel && onLevel(m / 128, (performance.now() - t0) / REC_MS); raf = requestAnimationFrame(tick); };
  const done = new Promise(res => mr.onstop = res);
  mr.start(); tick();
  await new Promise(r => setTimeout(r, REC_MS)); mr.stop(); await done; cancelAnimationFrame(raf);
  const blob = new Blob(chunks, { type: mr.mimeType || type || "audio/webm" });
  const dec = await ac.decodeAudioData(await blob.arrayBuffer()); ac.close();
  const off = new OfflineAudioContext(1, Math.ceil(dec.duration * SR), SR);
  const src = off.createBufferSource(); src.buffer = dec; src.connect(off.destination); src.start();
  const out = await off.startRendering();
  return { pcm: out.getChannelData(0).slice(), blob };
}

/* ---------- قصّ الصمت ---------- */
function trim(x) {
  const F = 400, H = 160, n = Math.max(0, Math.floor((x.length - F) / H) + 1), e = [];
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < F; j++) { const v = x[i * H + j]; s += v * v; } e.push(Math.sqrt(s / F)); }
  if (!e.length) return null;
  const sorted = e.slice().sort((a, b) => a - b), noise = sorted[Math.floor(sorted.length * .1)], peak = sorted[sorted.length - 1];
  const th = Math.max(noise * 3, peak * .12, .004);
  let a = e.findIndex(v => v > th), b = e.length - 1 - e.slice().reverse().findIndex(v => v > th);
  if (a < 0 || peak < .01) return null;
  a = Math.max(0, a - 3); b = Math.min(e.length - 1, b + 3);
  if ((b - a) * H < SR * .12) return null;
  return x.subarray(a * H, b * H + F);
}

/* ---------- MFCC: 25 مللي ثانية كل 10، 26 مرشح ميل، 12 معاملاً مع إزالة المتوسط ---------- */
const NFFT = 512, NMEL = 26, NCEP = 12;
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
      for (let j = 0; j < len / 2; j++) { const a = i + j, b = a + len / 2, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti; const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } }
  }
}
const hz2mel = (f) => 2595 * Math.log10(1 + f / 700), mel2hz = (m) => 700 * (10 ** (m / 2595) - 1);
const MELB = (() => { const lo = hz2mel(80), hi = hz2mel(7600), pts = Array.from({ length: NMEL + 2 }, (_, i) => Math.floor((NFFT + 1) * mel2hz(lo + (hi - lo) * i / (NMEL + 1)) / SR));
  return Array.from({ length: NMEL }, (_, m) => { const w = new Float32Array(NFFT / 2 + 1);
    for (let k = pts[m]; k < pts[m + 1]; k++) w[k] = (k - pts[m]) / Math.max(1, pts[m + 1] - pts[m]);
    for (let k = pts[m + 1]; k < pts[m + 2]; k++) w[k] = (pts[m + 2] - k) / Math.max(1, pts[m + 2] - pts[m + 1]); return w; }); })();
const HAMM = Float32Array.from({ length: 400 }, (_, i) => .54 - .46 * Math.cos(2 * Math.PI * i / 399));
function mfcc(x) {
  const F = 400, H = 160, frames = [];
  for (let s = 0; s + F <= x.length; s += H) {
    const re = new Float32Array(NFFT), im = new Float32Array(NFFT);
    for (let i = 0; i < F; i++) re[i] = (x[s + i] - .97 * (x[s + i - 1] || 0)) * HAMM[i];
    fft(re, im);
    const pw = new Float32Array(NFFT / 2 + 1); for (let k = 0; k <= NFFT / 2; k++) pw[k] = re[k] * re[k] + im[k] * im[k];
    const mel = MELB.map(w => { let s2 = 1e-10; for (let k = 0; k < w.length; k++) s2 += w[k] * pw[k]; return Math.log(s2); });
    const c = []; for (let n = 1; n <= NCEP; n++) { let v = 0; for (let m = 0; m < NMEL; m++) v += mel[m] * Math.cos(Math.PI * n * (m + .5) / NMEL); c.push(v); }
    frames.push(c);
  }
  // إزالة متوسط كل معامل: يقلّل أثر اختلاف الميكروفون والمتكلم
  const mean = Array(NCEP).fill(0); frames.forEach(f => f.forEach((v, i) => mean[i] += v / frames.length));
  return frames.map(f => f.map((v, i) => Math.round((v - mean[i]) * 100) / 100));
}

/* ---------- DTW: المسافة بين تسجيلين مع مطّ الزمن ---------- */
function dtw(a, b) {
  const n = a.length, m = b.length, D = new Float32Array((n + 1) * (m + 1)).fill(Infinity), L = new Uint16Array((n + 1) * (m + 1));
  D[0] = 0;
  const dist = (p, q) => { let s = 0; for (let i = 0; i < NCEP; i++) { const d = p[i] - q[i]; s += d * d; } return Math.sqrt(s); };
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    const c = dist(a[i - 1], b[j - 1]), x = (i - 1) * (m + 1) + j, y = i * (m + 1) + j - 1, z = (i - 1) * (m + 1) + j - 1;
    let best = z; if (D[x] < D[best]) best = x; if (D[y] < D[best]) best = y;
    D[i * (m + 1) + j] = D[best] + c; L[i * (m + 1) + j] = L[best] + 1;
  }
  return D[n * (m + 1) + m] / Math.max(1, L[n * (m + 1) + m]);
}
// يرتّب المقاطع المرشّحة من الأقرب، مع نسبة ثقة
function classify(feat, cands, kind) {
  const rows = cands.map(k => ({ k, d: Math.min(...refsOf(k, kind).map(r => dtw(feat, r.f))) })).filter(r => isFinite(r.d)).sort((a, b) => a.d - b.d);
  if (!rows.length) return [];
  const T = Math.max(.5, rows[0].d * .12), ex = rows.map(r => Math.exp(-(r.d - rows[0].d) / T)), sum = ex.reduce((a, b) => a + b, 0);
  return rows.map((r, i) => Object.assign(r, { p: Math.round(ex[i] / sum * 100) }));
}

/* ---------- الواجهة ---------- */
function render() {
  const nRef = ITEMS.filter(it => refsOf(it.k, UI.kind).length).length;
  let h = `<header class="row" style="justify-content:space-between"><h1>🎙️ تجربة تقييم النطق</h1><a class="btn ghost small" href="index.html">↩ الموقع</a></header>
  <p class="muted">تجربة: هل يميّز الموقع «بَ / بِ / بُ» بمقارنة صوت الطالب بتسجيلات صحيحة؟ كل شيء يبقى على هذا الجهاز ولا يُرسل الصوت لأي مكان.</p>
  <div class="panel seg"><b style="align-self:center">طريقة القراءة:</b>
    <label><input type="radio" name="kind" value="syl" ${UI.kind === "syl" ? "checked" : ""}> المقطع وحده «بِ»</label>
    <label><input type="radio" name="kind" value="sp" ${UI.kind === "sp" ? "checked" : ""}> التهجئة «باء كسرة بِ»</label></div>
  <div class="tabs"><button class="tab ${UI.tab === "ref" ? "on" : ""}" data-tab="ref">١. التسجيلات المرجعية (${nRef}/12)</button><button class="tab ${UI.tab === "test" ? "on" : ""}" data-tab="test">٢. الاختبار</button></div>`;
  h += UI.tab === "ref" ? refTab() : testTab();
  root.innerHTML = h + (UI.msg ? `<p class="err">${esc(UI.msg)}</p>` : "");
  bind();
}
function refTab() {
  const sp = UI.kind === "sp";
  return `<div class="panel note"><b>كيف؟</b> اضغط 🎙️ واقرأ ${sp ? "التهجئة كاملة كما في الكتاب: «باء كسرة بِ» (عندك أربع ثوانٍ ونصف)" : "المقطع وحده بوضوح: «بِ» (عندك ثانيتان ونصف)"}. سجّل كل واحد <b>مرتين أو ثلاثاً</b>، والأفضل بصوتين مختلفين (أنت وطفل يقرأ صحيحاً).${sp ? " وسجّل أيضاً «المقطع وحده»: يستعمله الموقع للحكم على الصوت الأخير في التهجئة." : ""}</div>
  <div class="panel"><div class="meter" id="meter"><i></i></div></div>
  <div class="grid">${ITEMS.map(it => { const key = refKey(it.k, UI.kind), n = refsOf(it.k, UI.kind).length;
    return `<div class="item ${n ? "ok" : ""}"><span class="syl ${sp ? "spl" : ""}">${sp ? it.sp : it.k}</span><span class="muted">${sp ? "" : it.h + " · "}${n} تسجيل</span>
      <div class="row"><button class="btn small" data-rec="${key}" ${UI.busy ? "disabled" : ""}>🎙️</button>
      ${lastAudio[key] ? `<button class="btn ghost small" data-play="${key}">▶</button>` : ""}
      ${n ? `<button class="btn ghost small" data-undo="${key}" title="حذف آخر تسجيل">↶</button>` : ""}</div></div>`; }).join("")}</div>
  <div class="row"><button class="btn ghost small" id="wipe">🗑️ حذف كل التسجيلات والنتائج</button></div>`;
}
function testTab() {
  const sp = UI.kind === "sp", ready = ITEMS.filter(it => refsOf(it.k, UI.kind).length);
  if (ready.length < 3) return `<div class="panel"><p>سجّل التسجيلات المرجعية أولاً (على الأقل مقاطع حرف واحد بحركاته الثلاث).</p></div>`;
  if (!UI.target || !ready.some(it => it.k === UI.target)) UI.target = ready[Math.floor(Math.random() * ready.length)].k;
  const it = ITEMS.find(x => x.k === UI.target), R = UI.last;
  const logS = DB.log.filter(x => x.scope === UI.scope && (x.kind || "syl") === UI.kind), right = logS.filter(x => x.ok).length;
  return `<div class="panel seg"><label><input type="radio" name="scope" value="letter" ${UI.scope === "letter" ? "checked" : ""}> مقارنة الحركات الثلاث للحرف نفسه</label>
      <label><input type="radio" name="scope" value="all" ${UI.scope === "all" ? "checked" : ""}> مقارنة بكل المقاطع</label></div>
    <div class="panel"><p class="muted" style="text-align:center">يقرأ الطالب:</p><div class="big ${sp ? "spl" : ""}">${sp ? it.sp : it.k}</div>
      <div class="row" style="flex-direction:column"><button class="mic" id="mic" aria-label="سجّل" ${UI.busy ? "disabled" : ""}>🎙️</button><div class="meter" id="meter" style="max-width:260px"><i></i></div>
      <div class="row"><button class="btn ghost small" id="another">🔀 مقطع آخر</button>
        <select id="pick" class="btn ghost small">${ready.map(x => `<option value="${x.k}" ${x.k === it.k ? "selected" : ""}>${sp ? x.sp : x.k}</option>`).join("")}</select></div></div></div>
    ${R ? `<div class="panel result">${R.err ? `<p class="err">${esc(R.err)}</p>` : `
      ${R.sp ? `<div class="verdict ${R.ok ? "good" : "bad"}">سمعتُ: <span style="font-family:var(--f-letter)">${esc(R.heard)}</span> ${R.ok ? "✓" : "✗"}</div>
        <p class="muted">اسم الحركة: ${R.name.h} ${R.name.ok ? "✓" : "✗"} (ثقة ${R.name.p}%) · الصوت الأخير: ${R.syl ? `<span style="font-family:var(--f-letter)">${R.syl.k}</span> ${R.syl.ok ? "✓" : "✗"} (ثقة ${R.syl.p}%)` : "— (سجّل «المقطع وحده» ليُحكم عليه)"}</p>`
      : `<div class="verdict ${R.top.k === R.target ? "good" : "bad"}">سمعتُ: <span style="font-family:var(--f-letter)">${R.top.k}</span> ${R.top.k === R.target ? "✓" : "✗"} <span class="muted">(ثقة ${R.top.p}%)</span></div>`}
      <div class="bars">${R.rank.slice(0, 6).map(r => `<div class="bar"><b>${r.k}</b><span class="t"><i style="width:${r.p}%"></i></span><span class="muted">${r.p}%</span></div>`).join("")}</div>
      ${lastAudio._test ? `<button class="btn ghost small" data-play="_test">▶ اسمع ما سُجّل</button>` : ""}
      ${R.judged ? `<p class="muted">سُجّل حكمك ✓</p>` : `<p><b>هل حكم الموقع صحيح؟</b> (هل نطق الطالب فعلاً «${esc(R.heard || R.top.k)}»؟)</p>
        <div class="row"><button class="btn" data-judge="1">✓ نعم، صحيح</button><button class="btn ghost" data-judge="0">✗ لا، أخطأ الموقع</button></div>`}`}</div>` : ""}
    <div class="panel"><h2>النتيجة حتى الآن (${sp ? "التهجئة" : "المقطع وحده"} · ${UI.scope === "letter" ? "الحركات الثلاث" : "كل المقاطع"})</h2>
      <div class="score"><div><b>${logS.length}</b>محاولة</div><div><b>${right}</b>حكم صحيح</div><div><b>${logS.length ? Math.round(right / logS.length * 100) : 0}%</b>الدقة</div></div>
      <p class="muted" style="margin-top:8px">الهدف: 80% فأكثر بعد 20 محاولة على الأقل، مع أطفال على أندرويد وآيفون.</p>
      <div class="row" style="margin-top:8px"><button class="btn small" id="copy">📋 نسخ ملخص النتائج</button><button class="btn ghost small" id="clearlog">مسح النتائج</button></div></div>`;
}
function summary() {
  const ua = navigator.userAgent, dev = /iPhone|iPad/.test(ua) ? "آيفون/آيباد" : /Android/.test(ua) ? "أندرويد" : "حاسوب";
  let t = `نتيجة تجربة تقييم النطق — ${dev}\n`;
  ["syl", "sp"].forEach(kd => ["letter", "all"].forEach(sc => { const L = DB.log.filter(x => x.scope === sc && (x.kind || "syl") === kd); if (!L.length) return;
    const ok = L.filter(x => x.ok).length; t += `\n${kd === "sp" ? "التهجئة" : "المقطع وحده"} · ${sc === "letter" ? "الحركات الثلاث للحرف" : "كل المقاطع"}: ${ok} من ${L.length} (${Math.round(ok / L.length * 100)}%)\n`;
    const wrong = L.filter(x => !x.ok); if (wrong.length) t += "أخطاء الموقع: " + wrong.map(x => `${x.target}←${x.heard}`).join("، ") + "\n"; }));
  t += `\nالمراجع (المقطع): ` + ITEMS.map(it => `${it.k}×${refsOf(it.k, "syl").length}`).join(" ");
  if (ITEMS.some(it => refsOf(it.k, "sp").length)) t += `\nالمراجع (التهجئة): ` + ITEMS.map(it => `${it.k}×${refsOf(it.k, "sp").length}`).join(" ");
  return t;
}
function level(v, p) { const m = document.querySelector("#meter i"); if (m) { m.style.width = Math.min(100, p * 100) + "%"; m.style.opacity = .35 + Math.min(1, v * 3) * .65; } }
async function capture() {
  UI.busy = true; UI.msg = ""; render();
  const btn = document.getElementById("mic"); if (btn) btn.classList.add("rec");
  try {
    const { pcm, blob } = await record(level);
    const seg = trim(pcm);
    if (!seg) throw new Error("quiet");
    return { feat: mfcc(seg), seg, blob };
  } catch (e) {
    UI.msg = e && e.message === "quiet" ? "لم أسمع صوتاً واضحاً. اقترب من الميكروفون وأعد المحاولة."
      : e && e.name === "NotAllowedError" ? "يحتاج الموقع إذن الميكروفون: اسمح به من إعدادات المتصفح ثم أعد المحاولة."
      : "تعذّر التسجيل على هذا المتصفح: " + (e && e.message || e);
    return null;
  } finally { UI.busy = false; }
}
function bind() {
  root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; UI.msg = ""; render(); });
  root.querySelectorAll("[data-rec]").forEach(b => b.onclick = async () => {
    const k = b.dataset.rec, r = await capture();
    if (r) { (DB.refs[k] = DB.refs[k] || []).push({ f: r.feat, at: Date.now() }); lastAudio[k] = r.blob; save(); }
    render();
  });
  root.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => { const a = DB.refs[b.dataset.undo]; a.pop(); if (!a.length) delete DB.refs[b.dataset.undo]; save(); render(); });
  root.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { const bl = lastAudio[b.dataset.play]; if (bl) new Audio(URL.createObjectURL(bl)).play(); });
  const w = document.getElementById("wipe"); if (w) w.onclick = () => { if (confirm("حذف كل التسجيلات المرجعية والنتائج من هذا الجهاز؟")) { DB = { refs: {}, log: [] }; save(); render(); } };
  root.querySelectorAll("input[name=kind]").forEach(r => r.onchange = () => { UI.kind = r.value; UI.last = null; UI.target = null; render(); });
  root.querySelectorAll("input[name=scope]").forEach(r => r.onchange = () => { UI.scope = r.value; UI.last = null; render(); });
  const mic = document.getElementById("mic");
  if (mic) mic.onclick = async () => {
    const target = UI.target, it = ITEMS.find(x => x.k === target);
    const r = await capture();
    if (!r) { UI.last = null; return render(); }
    lastAudio._test = r.blob;
    const cands = UI.scope === "letter" ? ITEMS.filter(x => x.l === it.l).map(x => x.k) : ITEMS.map(x => x.k);
    const rank = classify(r.feat, cands, UI.kind);
    if (!rank.length) UI.last = { err: "لا توجد تسجيلات مرجعية كافية لهذا الحرف." };
    else if (UI.kind !== "sp") UI.last = { target, rank, top: rank[0] };
    else {
      // التهجئة: (1) اسم الحركة من المقارنة الكاملة، (2) الصوت الأخير بمقارنة آخر الكلام بتسجيلات «المقطع وحده»
      const top = ITEMS.find(x => x.k === rank[0].k);
      const name = { h: top.h, ok: top.h === it.h, p: rank[0].p };
      let syl = null;
      const sylC = cands.filter(k => refsOf(k, "syl").length);
      if (sylC.length) {
        const lens = sylC.flatMap(k => refsOf(k, "syl").map(x => x.f.length)).sort((a, b) => a - b), L = Math.round(lens[lens.length >> 1] * 1.3);
        const tail = r.seg.subarray(Math.max(0, r.seg.length - (L * 160 + 240)));
        const sr = classify(mfcc(tail), sylC, "syl");
        if (sr.length) syl = { k: sr[0].k, ok: sr[0].k === target, p: sr[0].p };
      }
      const heardL = syl ? ITEMS.find(x => x.k === syl.k).l : top.l;
      const heard = NAMES[heardL] + " " + name.h + " " + (syl ? syl.k : "…");
      UI.last = { sp: true, target: it.sp, rank, top: { k: heard, p: name.p }, heard, name, syl, ok: name.ok && (!syl || syl.ok) };
    }
    render();
  };
  const an = document.getElementById("another"); if (an) an.onclick = () => { UI.target = null; UI.last = null; render(); };
  const pk = document.getElementById("pick"); if (pk) pk.onchange = () => { UI.target = pk.value; UI.last = null; render(); };
  root.querySelectorAll("[data-judge]").forEach(b => b.onclick = () => {
    const R = UI.last; DB.log.push({ kind: UI.kind, scope: UI.scope, target: R.target, heard: R.heard || R.top.k, ok: b.dataset.judge === "1", p: R.top.p, at: Date.now() });
    R.judged = true; save(); render();
  });
  const cp = document.getElementById("copy"); if (cp) cp.onclick = () => navigator.clipboard.writeText(summary()).then(() => { cp.textContent = "نُسخ ✓ أرسله في المحادثة"; }).catch(() => prompt("انسخ النص:", summary()));
  const cl = document.getElementById("clearlog"); if (cl) cl.onclick = () => { if (confirm("مسح نتائج الاختبار؟ (تبقى التسجيلات المرجعية)")) { DB.log = []; save(); render(); } };
}
// للفحص من وحدة التحكم
window.PronTest = { trim, mfcc, dtw, ITEMS, classify, DB: () => DB };
if (!navigator.mediaDevices || !window.MediaRecorder) UI.msg = "هذا المتصفح لا يدعم التسجيل. استعمل Chrome على أندرويد أو Safari على آيفون.";
render();
})();
</script>
</body>
</html>
